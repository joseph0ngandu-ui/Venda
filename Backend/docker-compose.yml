version: '3.8'

services:
  venda-api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://venda_user:venda_pass_2026@venda-db:5432/venda
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      venda-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - venda-network

  venda-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=venda_user
      - POSTGRES_PASSWORD=venda_pass_2026
      - POSTGRES_DB=venda
    ports:
      - "5432:5432"
    volumes:
      - venda-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venda_user -d venda"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - venda-network

volumes:
  venda-postgres-data:

networks:
  venda-network:
    driver: bridge
