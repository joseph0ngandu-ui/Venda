services:
  venda-web:
    build:
      context: ./Web
    image: venda-web:latest
    depends_on:
      venda-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VENDA_WEB_PORT:-3080}:80"
    restart: unless-stopped
    networks:
      - venda-network

  venda-api:
    build:
      context: ./Backend
    image: venda-api:latest
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://venda_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@venda-db:5432/venda
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
      DB_AUTO_MIGRATE: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://venda.kynto.me}
      CORS_ALLOW_NO_ORIGIN: "true"
    depends_on:
      venda-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - venda-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  venda-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: venda_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: venda
    volumes:
      - venda-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - venda-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venda_user -d venda"]
      interval: 5s
      timeout: 5s
      retries: 5

  venda-cloudflared:
    image: cloudflare/cloudflared:2026.5.0
    profiles:
      - remote-tunnel
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      venda-web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - venda-network

volumes:
  venda-postgres-data:
    name: venda-backend_venda-postgres-data
    external: true

networks:
  venda-network:
    name: venda-production-network
