name: Backend CI

on:
  push:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  backend:
    name: Build, Test, and Live Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: venda_ci
          POSTGRES_USER: venda_ci
          POSTGRES_PASSWORD: venda_ci_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U venda_ci -d venda_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Run backend tests
        run: npm test

      - name: Run live backend smoke against Postgres
        env:
          DATABASE_URL: postgres://venda_ci:venda_ci_pass@127.0.0.1:5432/venda_ci
          JWT_SECRET: venda-ci-live-smoke-secret-2026-04-02
          SMOKE_PORT: 3101
        run: npm run smoke:live
